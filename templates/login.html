        }
        .password-box {
    position: relative;

}

    top: 50%;

<body>

<div class="login-box">

   <img src="{{ url_for('static', filename='ganesh.png') }}"

</div>

<div style="

">

<button

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const eye = document.querySelector(".eye-icon");

        if (password.type === "password") {
            password.type = "text";
            eye.textContent = "🙈";
        } else {
            password.type = "password";
            eye.textContent = "👁";
        }
    }
 </script>
    <script>
        function createFlower() {

            const flower = document.createElement("div");

            flower.className = "flower";

            const flowers = ["🌸", "🌺", "🌼", "🌷"];

            flower.innerHTML =
                flowers[Math.floor(Math.random() * flowers.length)];

            flower.style.left = Math.random() * 100 + "vw";

            flower.style.fontSize =
                (15 + Math.random() * 20) + "px";

            flower.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(flower);

            setTimeout(function() {
                flower.remove();
            }, 10000);
        }

        setInterval(createFlower, 500);
</script>
<script>
function base64urlToUint8Array(base64url) {
    const padding =
        "=".repeat((4 - base64url.length % 4) % 4);

    const base64 =
        base64url
            .replace(/-/g, "+")
            .replace(/_/g, "/") + padding;

    const binary = atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}


function uint8ArrayToBase64url(bytes) {
    const uint8Array = new Uint8Array(bytes);

    let binary = "";

    for (let i = 0; i < uint8Array.length; i++) {
        binary += String.fromCharCode(uint8Array[i]);
    }

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");
}


/* =========================
   REGISTER DEVICE
========================= */

async function registerFingerprint() {

    try {

        const username =
            document.querySelector(
                'input[name="username"]'
            ).value.trim();

        if (!username) {
            alert("Please enter your username first.");
            return;
        }


        const response =
            await fetch(
                "/passkey/register/options",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username
                    })
                }
            );


        /*
         * Check HTTP response before trying JSON.
         */

        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Registration options error:",
                response.status,
                errorText
            );

            alert(
                "❌ Registration server error (" +
                response.status +
                ").\n\n" +
                errorText.substring(0, 300)
            );

            return;
        }


        const text = await response.text();

            console.log("Register options response:", text);

            let options;

            try {
                options = JSON.parse(text);
            } catch (e) {
                alert(
                    "❌ Server returned invalid JSON.\n\n" +
                    text.substring(0, 500)
                );
                return;
            }

        if (options.error) {

            alert(
                "❌ " + options.error
            );

            return;
        }


        /*
         * Convert WebAuthn values.
         */

        options.challenge =
            base64urlToUint8Array(
                options.challenge
            );


        if (options.user && options.user.id) {

            options.user.id =
                base64urlToUint8Array(
                    options.user.id
                );
        }


        if (options.excludeCredentials) {

            options.excludeCredentials =
                options.excludeCredentials.map(
                    credential => ({

                        ...credential,

                        id:
                            base64urlToUint8Array(
                                credential.id
                            )
                    })
                );
        }


        /*
         * Browser WebAuthn registration.
         */

        const credential =
            await navigator.credentials.create({
                publicKey: options
            });


        if (!credential) {

            alert(
                "❌ Registration cancelled."
            );

            return;
        }


        const responseData =
            credential.response;


        const credentialData = {

            id: credential.id,

            rawId:
                uint8ArrayToBase64url(
                    credential.rawId
                ),

            type: credential.type,

            response: {

                clientDataJSON:
                    uint8ArrayToBase64url(
                        responseData.clientDataJSON
                    ),

                attestationObject:
                    uint8ArrayToBase64url(
                        responseData.attestationObject
                    )
            }
        };


        /*
         * Send credential to Flask.
         */

        const verifyResponse =
            await fetch(
                "/passkey/register/verify",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        credential:
                            credentialData
                    })
                }
            );


        /*
         * Check Flask response.
         */

        if (!verifyResponse.ok) {

            const errorText =
                await verifyResponse.text();

            console.error(
                "Registration verification error:",
                verifyResponse.status,
                errorText
            );

            alert(
                "❌ Registration verification failed (" +
                verifyResponse.status +
                ").\n\n" +
                errorText.substring(0, 300)
            );

            return;
        }


        const result =
            await verifyResponse.json();


        if (result.success) {

            alert(
                "✅ Fingerprint registered successfully!"
            );

        } else {

            alert(
                "❌ " +
                (
                    result.error ||
                    "Registration failed."
                )
            );
        }


    } catch (error) {

        console.error(
            "Fingerprint registration error:",
            error
        );

        alert(
            "❌ Fingerprint registration failed.\n\n" +
            error.message
        );
    }
}


/* =========================
   LOGIN WITH FINGERPRINT
========================= */

async function loginWithFingerprint() {

    try {

        const username =
            document.querySelector(
                'input[name="username"]'
            ).value.trim();


        if (!username) {

            alert(
                "Please enter your username first."
            );

            return;
        }


        /*
         * Request authentication options.
         */

        const response =
            await fetch(
                "/passkey/login/options",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username
                    })
                }
            );


        /*
         * Check HTTP response before JSON.
         */

        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Login options error:",
                response.status,
                errorText
            );

            alert(
                "❌ Login server error (" +
                response.status +
                ").\n\n" +
                errorText.substring(0, 300)
            );

            return;
        }


        const options =
            await response.json();


        if (options.error) {

            alert(
                "❌ " + options.error
            );

            return;
        }


        /*
         * Convert challenge.
         */

        options.challenge =
            base64urlToUint8Array(
                options.challenge
            );


        /*
         * Convert allowed credentials.
         */

        if (options.allowCredentials) {

            options.allowCredentials =
                options.allowCredentials.map(
                    credential => ({

                        ...credential,

                        id:
                            base64urlToUint8Array(
                                credential.id
                            )
                    })
                );
        }


        /*
         * Browser WebAuthn authentication.
         */

        const credential =
            await navigator.credentials.get({
                publicKey: options
            });


        if (!credential) {

            alert(
                "❌ Fingerprint authentication cancelled."
            );

            return;
        }


        const responseData =
            credential.response;


        const credentialData = {

            id: credential.id,

            rawId:
                uint8ArrayToBase64url(
                    credential.rawId
                ),

            type: credential.type,

            response: {

                clientDataJSON:
                    uint8ArrayToBase64url(
                        responseData.clientDataJSON
                    ),

                authenticatorData:
                    uint8ArrayToBase64url(
                        responseData.authenticatorData
                    ),

                signature:
                    uint8ArrayToBase64url(
                        responseData.signature
                    ),

                userHandle:
                    responseData.userHandle
                        ? uint8ArrayToBase64url(
                            responseData.userHandle
                        )
                        : null
            }
        };


        /*
         * Send authentication response to Flask.
         */

        const verifyResponse =
            await fetch(
                "/passkey/login/verify",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username: username,

                        credential:
                            credentialData
                    })
                }
            );


        /*
         * Check Flask response.
         */

        if (!verifyResponse.ok) {

            const errorText =
                await verifyResponse.text();

            console.error(
                "Login verification error:",
                verifyResponse.status,
                errorText
            );

            alert(
                "❌ Login verification failed (" +
                verifyResponse.status +
                ").\n\n" +
                errorText.substring(0, 300)
            );

            return;
        }


        const result =
            await verifyResponse.json();


        if (result.success) {

            window.location.href =
                result.redirect;

        } else {

            alert(
                "❌ " +
                (
                    result.error ||
                    "Fingerprint login failed."
                )
            );
        }


    } catch (error) {

        console.error(
            "Fingerprint login error:",
            error
        );

        alert(
            "❌ Fingerprint login failed.\n\n" +
            error.message
        );
    }
}
</script>
