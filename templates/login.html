<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinayaka Chavithi Admin Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff9933,#ffcc66,#fff7e6);
        }

        .login-box{
            width:380px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            text-align:center;
        }

        .login-box img{
            width:120px;
            height:120px;
            object-fit:cover;
            margin-bottom:15px;
        }

        h2{
            color:#d35400;
            margin-bottom:25px;
        }

        label{
            display:block;
            text-align:left;
            font-weight:bold;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border:2px solid orange;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#ff6600;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#e65100;
        }

        .error{
            color:red;
            margin-top:15px;
            font-weight:bold;
        }

        .footer{
            margin-top:20px;
            color:#666;
            font-size:14px;
        }
        .logo-container {
        text-align: center;
        margin-bottom: 15px;
        }

        .ganesh-logo {
        width: 60px;
        height: 60px;
        object-fit: contain;
        }

    </style>

</head>

<body>

<div class="login-box">

   <img src="{{ url_for('static', filename='ganesh.png') }}"
     alt="Ganesh"
     class="ganesh-logo">

    <h2>🪔 Vinayaka Chavithi Admin Login</h2>

    <form method="POST">

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <p class="error">{{ msg }}</p>

    <div class="footer">
        © 2026 Vinayaka Chavithi Chandha Collection
    </div>

</div>

</body>
</html>
