<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .title {
            text-align: center;
            color: #0d1b3d;
            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .title p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        label span {
            color: red;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0d1b3d;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #198754;
            color: white;
        }

        .save-btn:hover {
            background: #157347;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .back-btn:hover {
            background: #5c636a;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .form-card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <div class="title">
            <h1>💳 Add Payment</h1>
            <p>Enter the payment details for verification</p>
        </div>

        <form method="POST"
              action="{{ url_for('add_payment') }}">

            <!-- DONOR NAME -->
            <div class="form-group">

                <label>
                    Donor Name <span>*</span>
                </label>

                <input
                    type="text"
                    name="donor_name"
                    placeholder="Enter donor name"
                    required>

            </div>


            <!-- MOBILE -->
            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    pattern="[6-9][0-9]{9}">

            </div>


            <!-- AMOUNT -->
            <div class="form-group">

                <label>
                    Amount <span>*</span>
                </label>

                <input
                    type="number"
                    name="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required>

            </div>


            <!-- TRANSACTION ID -->
            <div class="form-group">

                <label>
                    Transaction / UTR ID
                </label>

                <input
                    type="text"
                    name="transaction_id"
                    placeholder="Enter UPI transaction ID / UTR">

            </div>


            <!-- PAYMENT METHOD -->
            <div class="form-group">

                <label>
                    Payment Method
                </label>

                <select name="payment_method">

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="PhonePe">
                        PhonePe
                    </option>

                    <option value="Google Pay">
                        Google Pay
                    </option>

                    <option value="Paytm">
                        Paytm
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- DATE -->
            <div class="form-group">

                <label>
                    Payment Date <span>*</span>
                </label>

                <input
                    type="date"
                    name="payment_date"
                    id="payment_date"
                    required>

            </div>


            <!-- STATUS -->
            <div class="form-group">

                <label>
                    Status
                </label>

                <select name="status">

                    <option value="Pending">
                        ⏳ Pending
                    </option>

                    <option value="Verified">
                        ✅ Verified
                    </option>

                    <option value="Rejected">
                        ❌ Rejected
                    </option>

                </select>

            </div>


            <!-- REMARKS -->
            <div class="form-group">

                <label>
                    Remarks
                </label>

                <textarea
                    name="remarks"
                    placeholder="Enter any additional information"></textarea>

            </div>


            <!-- BUTTONS -->
            <div class="buttons">

                <a
                    href="{{ url_for('payment_history') }}"
                    class="btn back-btn">

                    ← Back

                </a>

                <button
                    type="submit"
                    class="btn save-btn">

                    💾 Save Payment

                </button>

            </div>

        </form>

    </div>

</div>


<script>

    // Automatically set today's date
    document.getElementById("payment_date").value =
        new Date().toISOString().split("T")[0];

</script>

</body>
</html>
